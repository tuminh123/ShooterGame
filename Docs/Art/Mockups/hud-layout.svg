<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges">
  <defs>
    <pattern id="floor" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#3d3029"/>
      <rect width="24" height="24" fill="#463830"/>
      <rect x="24" y="24" width="24" height="24" fill="#463830"/>
      <path d="M0 47h48M47 0v48" stroke="#332720" stroke-width="1"/>
    </pattern>
    <pattern id="dark" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#241a14"/>
      <rect width="4" height="4" fill="#2a1f18"/>
      <rect x="4" y="4" width="4" height="4" fill="#2a1f18"/>
    </pattern>
    <linearGradient id="hpgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e04535"/>
      <stop offset="1" stop-color="#a02020"/>
    </linearGradient>
    <linearGradient id="xpgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6a84a"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
  </defs>

  <!-- Nền game -->
  <rect width="1280" height="720" fill="url(#floor)"/>
  <g stroke="#241a14" stroke-width="3" fill="none">
    <rect x="0" y="0" width="1280" height="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="1080" y1="0" x2="1080" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
  </g>

  <!-- ===== BẢNG PLAYER (trên - trái) ===== -->
  <g transform="translate(24,24)">
    <rect width="460" height="78" fill="#2a1f18"/>
    <rect x="4" y="4" width="452" height="70" fill="#3d3029"/>
    <rect x="8" y="8" width="54" height="54" fill="url(#dark)" stroke="#241a14" stroke-width="3"/>
    <rect x="20" y="20" width="30" height="30" fill="#c0392b" stroke="#e04535" stroke-width="2"/>
    <rect x="27" y="27" width="16" height="16" fill="#e04535"/>
    <text x="76" y="34" font-family="monospace" font-weight="bold" font-size="17" fill="#e8dcc8">HIỆP SĨ THÁNH</text>
    <text x="76" y="56" font-family="monospace" font-size="12" fill="#b8a888">LV 7 · 134/180 EXP</text>
    <!-- Thanh HP -->
    <text x="76" y="74" font-family="monospace" font-size="11" fill="#e8dcc8">HP</text>
    <rect x="94" y="62" width="320" height="12" fill="#1a120e"/>
    <rect x="96" y="64" width="268" height="8" fill="url(#hpgrad)"/>
    <g stroke="#e8dcc8" stroke-width="1" opacity="0.85">
      <line x1="136" y1="64" x2="136" y2="72"/><line x1="176" y1="64" x2="176" y2="72"/>
      <line x1="216" y1="64" x2="216" y2="72"/><line x1="256" y1="64" x2="256" y2="72"/>
      <line x1="296" y1="64" x2="296" y2="72"/><line x1="336" y1="64" x2="336" y2="72"/>
      <line x1="376" y1="64" x2="376" y2="72"/>
    </g>
  </g>

  <!-- ===== MINIMAP + WAVE (trên - phải) ===== -->
  <g transform="translate(1092,24)">
    <rect width="164" height="26" fill="#2a1f18" stroke="#241a14" stroke-width="3"/>
    <text x="82" y="17" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="13" fill="#e8dcc8">WAVE 7</text>
    <rect y="30" width="164" height="164" fill="#1a120e" stroke="#241a14" stroke-width="3"/>
    <rect x="8" y="38" width="148" height="148" fill="#2e231b"/>
    <g stroke="#3d3029" stroke-width="1">
      <path d="M8 90h148M8 134h148M60 38v148M106 38v148"/>
    </g>
    <!-- điểm quái -->
    <g fill="#c0392b">
      <rect x="28" y="52" width="8" height="8"/><rect x="86" y="52" width="8" height="8"/>
      <rect x="124" y="88" width="8" height="8"/><rect x="28" y="124" width="8" height="8"/>
      <rect x="124" y="160" width="8" height="8"/><rect x="86" y="160" width="8" height="8"/>
      <rect x="46" y="88" width="6" height="6"/><rect x="102" y="124" width="6" height="6"/>
    </g>
    <!-- pickup vàng -->
    <g fill="#d6a84a">
      <rect x="70" y="70" width="6" height="6"/><rect x="106" y="106" width="6" height="6"/>
      <rect x="34" y="162" width="6" height="6"/>
    </g>
    <!-- player -->
    <rect x="82" y="106" width="10" height="10" fill="#f4f0e8" stroke="#241a14" stroke-width="1"/>
    <polygon points="87,101 93,106 87,111 81,106" fill="#e04535"/>
  </g>

  <!-- ===== JOYSTICK (dưới - phải) ===== -->
  <g transform="translate(1112,612)">
    <circle cx="56" cy="56" r="56" fill="#241a14"/>
    <circle cx="56" cy="56" r="50" fill="#3d3029" stroke="#e8dcc8" stroke-width="3"/>
    <circle cx="56" cy="56" r="40" fill="#2a1f18" stroke="#1a120e" stroke-width="3"/>
    <circle cx="80" cy="44" r="22" fill="#5a4a3a" stroke="#e8dcc8" stroke-width="3"/>
    <g stroke="#1a120e" stroke-width="3"><line x1="56" y1="2" x2="56" y2="22"/><line x1="56" y1="90" x2="56" y2="110"/><line x1="2" y1="56" x2="22" y2="56"/><line x1="90" y1="56" x2="110" y2="56"/></g>
  </g>

  <!-- ===== THANH KỸ NĂNG (dưới - trái) ===== -->
  <g transform="translate(24,612)">
    <rect width="400" height="56" fill="#2a1f18" stroke="#241a14" stroke-width="3"/>
    <text x="12" y="20" font-family="monospace" font-size="12" fill="#b8a888">KỸ NĂNG</text>
    <!-- slot 1 - có cooldown -->
    <g transform="translate(12,26)">
      <rect width="42" height="42" fill="#3d3029" stroke="#e8dcc8" stroke-width="2"/>
      <rect x="4" y="4" width="34" height="34" fill="#241a14"/>
      <rect x="12" y="12" width="18" height="18" fill="#e04535"/>
      <rect x="15" y="15" width="12" height="12" fill="#f4f0e8"/>
      <rect y="0" width="42" height="18" fill="#1a120e" opacity="0.85"/>
      <text x="21" y="13" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8dcc8">4s</text>
      <text x="21" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8dcc8">1</text>
    </g>
    <!-- slot 2 -->
    <g transform="translate(62,26)">
      <rect width="42" height="42" fill="#3d3029" stroke="#e8dcc8" stroke-width="2"/>
      <rect x="4" y="4" width="34" height="34" fill="#241a14"/>
      <rect x="12" y="12" width="18" height="18" fill="#d6a84a"/>
      <rect x="16" y="16" width="10" height="10" fill="#f4f0e8"/>
      <text x="21" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8dcc8">2</text>
    </g>
    <!-- slot 3 -->
    <g transform="translate(112,26)">
      <rect width="42" height="42" fill="#3d3029" stroke="#e8dcc8" stroke-width="2"/>
      <rect x="4" y="4" width="34" height="34" fill="#241a14"/>
      <rect x="12" y="12" width="18" height="18" fill="#4a82c8"/>
      <rect x="15" y="15" width="12" height="12" fill="#c4e8ff"/>
      <text x="21" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8dcc8">3</text>
    </g>
    <!-- slot 4 -->
    <g transform="translate(162,26)">
      <rect width="42" height="42" fill="#3d3029" stroke="#e8dcc8" stroke-width="2"/>
      <rect x="4" y="4" width="34" height="34" fill="#241a14"/>
      <path d="M13 13 L29 13 L21 13 L21 29 L13 29 Z" fill="#d8a44c" stroke="#8a6a2a" stroke-width="2"/>
      <text x="21" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8dcc8">4</text>
    </g>
    <!-- vàng + mạng -->
    <g transform="translate(228,14)">
      <circle cx="10" cy="10" r="9" fill="#d6a84a" stroke="#8a6a2a" stroke-width="2"/>
      <circle cx="10" cy="10" r="3" fill="#8a6a2a"/>
      <text x="26" y="14" font-family="monospace" font-size="13" fill="#e8dcc8">1.240</text>
      <text x="26" y="34" font-family="monospace" font-size="12" fill="#e8dcc8">♥ 3</text>
    </g>
  </g>

  <!-- ===== CHỮ THÔNG BÁO GIỮA MÀN HÌNH ===== -->
  <g transform="translate(640,360)" opacity="0.9">
    <rect x="-200" y="-30" width="400" height="60" fill="#1a120e" stroke="#e8dcc8" stroke-width="3"/>
    <text y="10" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="20" fill="#e8dcc8">+50 EXP</text>
    <text y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#d6a84a">Nhặt: Đá Kinh Nghiệm</text>
  </g>

  <!-- Ghi chú -->
  <text x="640" y="706" text-anchor="middle" font-family="monospace" font-size="12" fill="#b8a888">MOCKUP HUD · 1280×720 · ShooterGame — chỉ mang tính tham khảo bố cục</text>
</svg>
